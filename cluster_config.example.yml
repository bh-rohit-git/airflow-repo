# Copy to cluster_config.yml and replace placeholders before migrate-repo.
# Migration reads cluster_config.yml (or this example) and emits cluster_config.yml
# into the migrated output with literal Dataproc settings.

gcp_project_id: YOUR_GCP_PROJECT
gcp_region: us-east1
dataproc_cluster_name: bh-migrate-databricks
dataproc_zone: us-central1-a
dataproc_subnetwork: projects/bh-vpc-host-nprd/regions/us-east1/subnetworks/nprd-bh-use1-dev-us-east1
dataproc_service_account: bh-d-dataproc-sa@nprd-bh-use1-dev.iam.gserviceaccount.com
dataproc_master_num_instances: 1
dataproc_master_machine_type: n2-standard-2
dataproc_master_boot_disk_size_gb: 50
dataproc_master_boot_disk_type: pd-standard
dataproc_worker_num_instances: 0
dataproc_worker_machine_type: n2-standard-2
dataproc_worker_boot_disk_size_gb: 50
dataproc_worker_boot_disk_type: pd-standard
dataproc_image_version: 2.2.81-debian12
dataproc_idle_delete_ttl: 1800
raw_ingestion_jar_uri: gs://YOUR_BUCKET/jars/raw-ingestion_2.12-0.3.7.jar
raw_ingestion_sales_csv_uri: gs://YOUR_BUCKET/data/sales.csv

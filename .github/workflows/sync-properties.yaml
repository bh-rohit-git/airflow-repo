# Sync properties/config to Composer GCS bucket (plugins/) via WIF
#
# GitHub Environment vars (optional overrides):
#   GCP_PROJECT_ID, WORKLOAD_IDENTITY_PROVIDER, GCP_SERVICE_ACCOUNT, GCS_BUCKET
#
# Infra defaults (bh-infra-repo composer_cicd.tf):
#   SA: bh-dev-composer-cicd@nprd-bh-use1-dev.iam.gserviceaccount.com
#   Bucket: gs://us-east1-bh-d-composer-usea-754b7438-bucket/plugins
#
name: Sync properties to Composer GCS

on:
  workflow_dispatch:
    inputs:
      target_environment:
        description: 'GitHub Environment to use (loads env secrets/vars)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod
        default: 'dev'

env:
  GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'nprd-bh-use1-dev' }}
  WORKLOAD_IDENTITY_PROVIDER: ${{ vars.WORKLOAD_IDENTITY_PROVIDER || 'projects/609754835936/locations/global/workloadIdentityPools/dev-gh-actions-pool/providers/dev-ghactions-provider' }}
  GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'bh-dev-composer-cicd@nprd-bh-use1-dev.iam.gserviceaccount.com' }}
  GCS_BUCKET: ${{ vars.GCS_BUCKET || 'us-east1-bh-d-composer-usea-754b7438-bucket' }}
  SOURCE_DIR: plugins
  GCS_PREFIX: plugins

jobs:
  sync-properties:
    name: Sync plugins/ to GCS
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.target_environment }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud via WIF
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: Sync plugins/ folder to GCS
        run: |
          set -euo pipefail

          SOURCE="${{ env.SOURCE_DIR }}"
          BUCKET="${{ env.GCS_BUCKET }}"
          PREFIX="${{ env.GCS_PREFIX }}"

          BUCKET="${BUCKET#gs://}"
          BUCKET="${BUCKET%/}"
          PREFIX="${PREFIX#/}"
          PREFIX="${PREFIX%/}"

          if [ ! -d "$SOURCE" ]; then
            echo "Error: ${SOURCE}/ directory does not exist in this repository."
            exit 1
          fi

          if [ -z "$(find "$SOURCE" -type f | head -n 1)" ]; then
            echo "Error: ${SOURCE}/ exists but contains no files."
            exit 1
          fi

          DEST_URI="gs://${BUCKET}/${PREFIX}"
          echo "Syncing '${SOURCE}/' to '${DEST_URI}/' (preserving folder structure)..."

          gcloud storage rsync "$SOURCE" "$DEST_URI" \
            --recursive

          echo "Properties sync completed successfully."

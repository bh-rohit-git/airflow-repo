runtime_notebooks: true
catalog: databricks-migrate-activity
sources:
- databricks-migrate-activity.schema1.customer_events
clone_notebook: notebooks/dualrun/ensure_clones.py
compare_notebook: notebooks/dualrun/compare_outputs.py
compare_pairs:
- left_ref: databricks-migrate-activity.schema1.customer_events_dual_clone_1
  right_ref: databricks-migrate-activity.schema1.customer_events_dual_clone_2
  label: customer_events
compare_config:
  enabled: true
  report:
    root_uri: gs://{{ var.value.dual_run_bucket }}/dual_run/reports
    summary_json: true
    summary_markdown: true
    summary_html: false
    detail_format: parquet
    write_audit_tables: true
    audit_catalog: migration_audit
    audit_schema: dualrun
  row_details:
    enabled: true
    max_issue_rows_per_table: null
    max_sample_rows_in_summary: 100
    include_full_row_json: true
    include_column_diff_json: true
    include_mismatch_columns: true
    max_json_length: 100000
  comparison_rules:
    fail_on_duplicate_keys: true
    ignored_columns:
    - _commit_timestamp
    - _commit_version
    - _change_type
    - _change_ordinal
    - run_id
    - load_ts
    - updated_at
    sensitive_columns: []
    numeric_tolerances: {}
    timestamp_tolerance_seconds: 0
  checks:
    enable_basic_stats: true
    enable_null_stats: true
    enable_distinct_stats: true
    enable_numeric_stats: true
    enable_datetime_stats: true
    enable_distribution_stats: true
    enable_row_comparison: true
    enable_delta_operation_metrics: true
    enable_delta_version_stats: true
    enable_distribution_by_status: false
  filters:
    business_date: null
    where_clause: null
  runtime:
    fail_process_on:
    - FAIL
    - BLOCKED
  numeric_columns: null
compare_results_path: gs://{{ var.value.dual_run_bucket }}/dual_run/reports/compare_results.json
run_parameters:
- parameter: merge-key
  role: other
  default_value: id
  evidence:
  - STATIC_DEFAULT
  required: false
  parameter_type: null
  inferred_type: null
  mockable: false
  schema_hint: null
  dag_run_parameter: null
- parameter: input-path
  role: source
  default_value: gs://databricks-8259550742932689-unitycatalog/8259550742932689/incoming/customer_events_merge.csv
  evidence:
  - JOB_CALL_GRAPH
  - STATIC_DEFAULT
  required: false
  parameter_type: null
  inferred_type: null
  mockable: true
  schema_hint: null
  dag_run_parameter: input_path
- parameter: target-table
  role: target
  default_value: databricks-migrate-activity.schema1.customer_events
  evidence:
  - JOB_CALL_GRAPH
  - STATIC_DEFAULT
  required: true
  parameter_type: null
  inferred_type: null
  mockable: true
  schema_hint: null
  dag_run_parameter: target_table
mock_source:
  enabled: true
  notebook: notebooks/dualrun/test_spark_merge_serverless_dag/mock_source_data.py
  mock_row_count: 1000
  mock_format: csv
  sample_size: 100
mock_notebook: notebooks/dualrun/test_spark_merge_serverless_dag/mock_source_data.py
tokens:
  clone_suffix: _dual_clone_
  source_mock_suffix: _source_mock
dualrun_dags:
  parent_dag_id: dualrun_Main_50ae8a8b63fb
  unmigrated_child_dag_id: dualrun_child_unmigrated_Main_50ae8a8b63fb
  migrated_child_dag_id: dualrun_child_migrated_Main_50ae8a8b63fb
  parent_relpath: dags/dualrun/dualrun_Main_50ae8a8b63fb.py
  unmigrated_child_relpath: dags/dualrun/dualrun_child_unmigrated_Main_50ae8a8b63fb.py
  migrated_child_relpath: dags/dualrun/dualrun_child_migrated_Main_50ae8a8b63fb.py
  production_source_dag_id: test_spark_merge_serverless_dag
  production_migrated_dag_id: test_spark_merge_serverless_dag
